name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          ls -la main.js
          # Check file size is reasonable (>10KB means it built properly)
          SIZE=$(stat -f%z main.js 2>/dev/null || stat -c%s main.js 2>/dev/null || wc -c < main.js)
          echo "main.js size: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then
            echo "❌ Build output too small"
            exit 1
          fi
          echo "✅ Build output verified ($SIZE bytes)"

      - name: Create mock session directories
        shell: bash
        run: |
          mkdir -p ~/.claude/projects/test-project
          mkdir -p ~/.codex/sessions/2026/01
          mkdir -p ~/.cursor/projects/test-project/agent-transcripts

      - name: Create mock Claude session
        shell: bash
        run: |
          cat > ~/.claude/projects/test-project/session.jsonl << 'JSONL'
          {"type":"user","timestamp":"2026-01-09T10:00:00Z","sessionId":"test1234","message":{"content":"Hello Claude"}}
          {"type":"assistant","timestamp":"2026-01-09T10:00:01Z","message":{"content":"Hello! How can I help?"}}
          JSONL

      - name: Create mock Codex session
        shell: bash
        run: |
          cat > ~/.codex/sessions/2026/01/session.jsonl << 'JSONL'
          {"type":"session_meta","payload":{"id":"codex123","timestamp":"2026-01-09T11:00:00Z","cwd":"/test","cli_version":"1.0.0"}}
          {"type":"response_item","payload":{"role":"user","content":[{"type":"input_text","text":"Help me code"}]}}
          {"type":"response_item","payload":{"role":"assistant","content":[{"type":"text","text":"Sure, I can help!"}]}}
          JSONL

      - name: Create mock Cursor session
        shell: bash
        run: |
          cat > ~/.cursor/projects/test-project/agent-transcripts/test.txt << 'TXT'
          user:
          <user_query>
          Test query for Cursor
          </user_query>

          A:
          This is a test response from Cursor.
          TXT

      - name: Run sync test
        shell: bash
        run: |
          node << 'TESTJS'
          const fs = require('fs');
          const path = require('path');
          const os = require('os');

          console.log('🖥️  Platform:', process.platform);
          console.log('🏠 Home dir:', os.homedir());

          // Test paths exist
          const claudePath = path.join(os.homedir(), '.claude', 'projects');
          const codexPath = path.join(os.homedir(), '.codex', 'sessions');
          const cursorPath = path.join(os.homedir(), '.cursor', 'projects');

          console.log('\n📂 Checking paths...');
          console.log('Claude:', fs.existsSync(claudePath) ? '✅' : '❌', claudePath);
          console.log('Codex:', fs.existsSync(codexPath) ? '✅' : '❌', codexPath);
          console.log('Cursor:', fs.existsSync(cursorPath) ? '✅' : '❌', cursorPath);

          // Test file reading
          function findFiles(dir, ext) {
            const files = [];
            function walk(d) {
              try {
                const entries = fs.readdirSync(d, { withFileTypes: true });
                for (const e of entries) {
                  const full = path.join(d, e.name);
                  if (e.isDirectory()) walk(full);
                  else if (e.name.endsWith(ext)) files.push(full);
                }
              } catch {}
            }
            walk(dir);
            return files;
          }

          console.log('\n📄 Finding session files...');
          const claudeFiles = findFiles(claudePath, '.jsonl');
          const codexFiles = findFiles(codexPath, '.jsonl');
          const cursorFiles = findFiles(cursorPath, '.txt');

          console.log('Claude sessions:', claudeFiles.length);
          console.log('Codex sessions:', codexFiles.length);
          console.log('Cursor sessions:', cursorFiles.length);

          // Test parsing
          if (claudeFiles.length > 0) {
            const content = fs.readFileSync(claudeFiles[0], 'utf-8');
            console.log('\n✅ Claude file readable, lines:', content.split('\n').length);
          }
          if (codexFiles.length > 0) {
            const content = fs.readFileSync(codexFiles[0], 'utf-8');
            console.log('✅ Codex file readable, lines:', content.split('\n').length);
          }
          if (cursorFiles.length > 0) {
            const content = fs.readFileSync(cursorFiles[0], 'utf-8');
            console.log('✅ Cursor file readable, lines:', content.split('\n').length);
          }

          // Test redaction
          const testSecrets = [
            'sk-ant-abc123xyz',
            'ghp_1234567890abcdef1234567890abcdef12',
            'postgres://user:pass@host/db',
            'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.test'
          ];

          console.log('\n🔒 Testing secret redaction...');
          const patterns = [
            [/sk-ant-[a-zA-Z0-9\-_]{10,}/g, '[REDACTED: Anthropic API Key]'],
            [/ghp_[a-zA-Z0-9]{36}/g, '[REDACTED: GitHub Token]'],
            [/postgres(ql)?:\/\/[^\s]+/g, '[REDACTED: Database URL]'],
            [/Bearer [a-zA-Z0-9\-_\.]{20,}/g, '[REDACTED: Bearer Token]']
          ];

          for (const secret of testSecrets) {
            let redacted = secret;
            for (const [pattern, replacement] of patterns) {
              redacted = redacted.replace(pattern, replacement);
            }
            const isRedacted = redacted.includes('[REDACTED');
            console.log(isRedacted ? '✅' : '❌', secret.slice(0, 20) + '...', '->', redacted.slice(0, 40));
          }

          console.log('\n✅ All cross-platform tests passed!');
          TESTJS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: |
            main.js
            manifest.json
            styles.css
